<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>专业术语英语打字练习</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0;
font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
background: linear-gradient(135deg, #eef4ff, #f8fbff);
height: 100vh;
overflow: hidden;
}
[hidden] { display: none !important; }
#topbar {
position: fixed; top: 18px; left: 18px; z-index: 20;
background: rgba(255, 255, 255, 0.95); padding: 14px 16px; border-radius: 14px;
box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); display: flex; flex-direction: column; gap: 10px; min-width: 280px;
}
.top-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
select, button { font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 8px 10px; outline: none; }
select { min-width: 170px; background: #fff; }
#startBtn { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
#startBtn:disabled { background: #93c5fd; cursor: not-allowed; }
#timer { font-size: 20px; font-weight: bold; color: #0f172a; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; min-width: 90px; text-align: center; }
#mainArea { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
#progress { font-size: 18px; color: #475569; margin-bottom: 16px; min-height: 24px; }
#starBtn {
background: #f59e0b; color: white; border: none; padding: 8px 18px; font-size: 16px; font-weight: bold;
border-radius: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.25); margin-bottom: 12px;
transition: all 0.2s;
}
#starBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(245, 158, 11, 0.35); }
#starBtn:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; box-shadow: none; transform: none; }
#starBtn.is-starred { background: #10b981; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25); }
#starBtn.is-starred:hover:not(:disabled) { box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35); }
#chineseWord { font-size: 56px; font-weight: 800; color: #111827; margin-bottom: 16px; max-width: 80vw; line-height: 1.25; }
#pronunciationArea { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 32px; min-height: 48px; flex-wrap: wrap; max-width: 90vw; }
#speakBtn { background: #10b981; color: white; border: none; padding: 10px 22px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); transition: all 0.2s; flex-shrink: 0; }
#speakBtn:hover:not(:disabled) { background: #059669; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35); }
#speakBtn:disabled { background: #a7f3d0; cursor: not-allowed; box-shadow: none; transform: none; }
#phoneticText { font-size: 24px; color: #475569; font-style: italic; font-family: "Lucida Sans Unicode", "Arial Unicode MS", "DejaVu Sans", sans-serif; text-align: left; line-height: 1.5; }
#inputArea { min-height: 110px; display: flex; align-items: flex-end; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 26px; }
.word-slot { min-width: 90px; min-height: 62px; padding: 6px 10px; font-size: 40px; font-weight: 700; border-bottom: 5px solid #334155; display: flex; align-items: center; justify-content: center; letter-spacing: 1px; color: #111827; background: rgba(255, 255, 255, 0.65); border-radius: 8px 8px 0 0; }
.word-slot.active { border-bottom-color: #2563eb; background: rgba(37, 99, 235, 0.08); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08); }
.placeholder { color: #c7cdd8; font-weight: normal; }
.ok { color: #16a34a; }
.bad { color: #dc2626; text-decoration: underline; }
#hint { color: #64748b; font-size: 15px; line-height: 1.8; }
#endBtn { position: fixed; right: 26px; bottom: 26px; z-index: 20; background: #dc2626; color: white; border: none; padding: 14px 24px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25); }
#endBtn:disabled { background: #fca5a5; cursor: not-allowed; box-shadow: none; }
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.dialog { width: min(920px, 94vw); max-height: 86vh; overflow: auto; background: white; border-radius: 18px; padding: 26px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25); }
.dialog h2 { margin-top: 0; color: #111827; }
.summary-stats { font-size: 18px; line-height: 2; color: #1f2937; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 18px; }
.wrong-item { border: 1px solid #fecaca; background: #fff5f5; border-radius: 12px; padding: 14px; margin-bottom: 12px; text-align: left; }
.wrong-item .zh { font-size: 20px; font-weight: bold; color: #111827; margin-bottom: 8px; }
.line-label { color: #475569; font-weight: bold; margin-right: 8px; }
.correct-word { color: #15803d; font-weight: bold; margin-right: 10px; }
.wrong-word { color: #dc2626; font-weight: bold; text-decoration: underline; margin-right: 10px; }
.missed-word { color: #94a3b8; font-weight: bold; margin-right: 10px; }
.all-answer { color: #334155; margin-top: 6px; }
#closeSummaryBtn { margin-top: 16px; background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; padding: 10px 18px; }
@media (max-width: 700px) {
#chineseWord { font-size: 36px; }
.word-slot { font-size: 28px; min-width: 64px; min-height: 48px; }
#topbar { min-width: auto; right: 18px; }
#phoneticText { font-size: 18px; }
}
</style>
</head>
<body>
<div id="topbar">
<div class="top-row">
<label for="categorySelect" style="font-weight:bold;">选择大类：</label>
<select id="categorySelect">
<option value="">请选择</option>
</select>
<button id="startBtn" disabled>开始练习</button>
</div>
<div class="top-row">
<span style="font-weight:bold;">计时：</span>
<div id="timer">00:00</div>
</div>
</div>
<div id="mainArea">
<div id="progress"></div>
<button id="starBtn" hidden disabled>⭐ 标记到错词本</button>
<div id="chineseWord">请选择大类，然后点击“开始练习”</div>
<div id="pronunciationArea">
<button id="speakBtn" disabled title="本地音标优先；未收录时尝试在线音标">🔊 发音</button>
<span id="phoneticText"></span>
</div>
<div id="inputArea"></div>
<div id="hint">
输入说明：字母错误会标红；多个英文单词用空格切换；按 Enter 提交并下一题；点击“发音”可听读音并查看音标。<br>
提示：遇到不会的词可点击“标记”加入错词本；在错词本中练习时，点击“已掌握”可将其移除。答错的词会自动加入错词本。
</div>
</div>
<button id="endBtn" disabled>结束练习</button>
<div id="summaryOverlay" class="overlay" hidden>
<div class="dialog">
<h2>练习总结</h2>
<div id="summaryStats" class="summary-stats"></div>
<h3>错误报告</h3>
<div id="errorReport"></div>
<button id="closeSummaryBtn">关闭并返回</button>
</div>
</div>

function loadWrongWords() {
    try {
        const raw = localStorage.getItem(WRONG_WORDS_KEY);
        wrongWordsBank = raw ? JSON.parse(raw) : {};
    } catch (e) { wrongWordsBank = {}; }
}
function saveWrongWords() { localStorage.setItem(WRONG_WORDS_KEY, JSON.stringify(wrongWordsBank)); }
function getTotalWrongWordsCount() {
    let count = 0;
    for (const cat in wrongWordsBank) count += wrongWordsBank[cat].length;
    return count;
}
function isWordStarred(category, zh, en) {
    if (!wrongWordsBank[category]) return false;
    return wrongWordsBank[category].some(item => item.zh === zh && item.en === en);
}
function addStarredWord(category, zh, en) {
    if (!wrongWordsBank[category]) wrongWordsBank[category] = [];
    if (!isWordStarred(category, zh, en)) {
        wrongWordsBank[category].push({ zh, en });
        saveWrongWords();
    }
}
function removeStarredWord(category, zh, en) {
    if (!wrongWordsBank[category]) return;
    wrongWordsBank[category] = wrongWordsBank[category].filter(item => !(item.zh === zh && item.en === en));
    if (wrongWordsBank[category].length === 0) delete wrongWordsBank[category];
    saveWrongWords();
}
function updateStarBtnState() {
    if (!running || currentIndex < 0 || currentIndex >= categoryData.length) {

    const item = categoryData[currentIndex];
    const itemCat = item.originalCategory || currentCategory;
    const starred = isWordStarred(itemCat, item[0], item[1]);
    if (isWrongWordsMode) {
        if (starred) { starBtn.textContent = "✅ 已掌握 (移除)"; starBtn.className = "is-starred"; }

function normalizePhoneticKey(text) { return String(text || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function getLocalPhonetic(text) {
    const key = normalizePhoneticKey(text);
    if (!key) return "";
    if (LOCAL_PHONETICS[key]) return LOCAL_PHONETICS[key];
    const words = key.split(/\s+/).filter(Boolean);
    if (words.length > 1) {
        const parts = [];
        for (const word of words) { const wp = LOCAL_PHONETICS[word]; if (!wp) return ""; parts.push(wp); }
        if (parts.length === words.length) return parts.join(" ");
    }
    return "";
}
function prepareSpeechText(text) {
    const raw = String(text || "").trim(); if (!raw) return "";
    return raw.split(/\s+/).filter(Boolean).map(token => {
        const lo = token.replace(/[^A-Za-z]/g, "");
        if (/^[A-Z]{2,6}$/.test(lo)) return lo.split("").join(" ");
        if (/^[A-Z]$/.test(lo)) return lo;
        return token;
    }).join(" ");
}
function speakWord(text) {
    if (!text || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(prepareSpeechText(text) || text);
    u.lang = "en-US"; u.rate = 0.9; u.pitch = 1;
    window.speechSynthesis.speak(u);
}
async function getOnlinePhoneticForWord(word) {
    try {
        const cw = String(word || "").trim(); if (!cw) return "";
        const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cw.toLowerCase())}`);
        if (!res.ok) return "";
        const data = await res.json(); const entry = Array.isArray(data) ? data[0] : null;
        if (!entry || !Array.isArray(entry.phonetics)) return "";
        const us = entry.phonetics.find(i => i.text && i.audio && i.audio.includes("-us"));
        if (us && us.text) return us.text;
        const sl = entry.phonetics.find(i => i.text && i.text.startsWith("/"));
        if (sl && sl.text) return sl.text;
        const any = entry.phonetics.find(i => i.text);
        return (any && any.text) ? any.text : "";
    } catch { return ""; }
}
async function fetchPhonetic(text) {
    const rid = ++phoneticRequestId;
    if (!text) { phoneticText.textContent = ""; return; }
    const lp = getLocalPhonetic(text);
    if (lp) { phoneticText.textContent = lp; phoneticText.style.color = "#0f766e"; return; }
    phoneticText.textContent = "尝试获取音标中..."; phoneticText.style.color = "#94a3b8";
    try {
        const words = String(text).split(/\s+/).filter(Boolean);
        const ps = await Promise.all(words.map(async w => {
            const ck = normalizePhoneticKey(w);
            if (phoneticCache.has(ck)) return phoneticCache.get(ck);
            const op = await getOnlinePhoneticForWord(w);
            phoneticCache.set(ck, op); return op;
        }));
        if (rid !== phoneticRequestId) return;
        if (ps.length > 0 && ps.every(Boolean)) { phoneticText.textContent = ps.join(" ") + "（自动音标，仅供参考）"; phoneticText.style.color = "#475569"; }
        else { phoneticText.textContent = "（暂无可靠音标）"; phoneticText.style.color = "#94a3b8"; }
    } catch { if (rid === phoneticRequestId) { phoneticText.textContent = "（音标获取失败）"; phoneticText.style.color = "#ef4444"; } }
}
speakBtn.addEventListener("click", () => {
    if (!running || currentIndex < 0 || currentIndex >= categoryData.length) return;
    const t = currentItemVariants[0] || "";
    if (t) { speakWord(t); fetchPhonetic(t); }
});

// =====================
// 词库与练习逻辑
// =====================
function initBank() {
    const raw = document.getElementById("raw-data").textContent || "";
    const lines = raw.split(/\r?\n/); let current = null;
    for (const rawLine of lines) {
        const line = rawLine.trim(); if (!line) continue;
        const heading = line.match(/^([一二三四五六七八九十]+)\s*[、．.]\s*(.+)$/);
        if (heading) { current = heading[2].trim(); if (!bank[current]) bank[current] = []; continue; }
        if (!current || !CATEGORY_ORDER.includes(current)) continue;
        const m = line.match(/^(.*?)[：:](.*)$/);
        if (m) { const zh = m[1].trim(); const en = m[2].trim(); if (zh && en) bank[current].push([zh, en]); }
    }
    if (!bank["通用之件类"]) bank["通用之件类"] = [];
    [["工程变更通知(供应商)","ECN"],["工程改动要求(客户)","ECO"],["工序改动通知","PCN"],["制造作业规范","SOP"],["物料清单","BOM"],["包装规范","PS"],["规格","SPEC"],["图纸","DWG"]]
    .forEach(item => { if (!bank["通用之件类"].some(x => x[0] === item[0])) bank["通用之件类"].push(item); });
}
function updateSelectOptions() {
    const cv = selectEl.value;
    selectEl.innerHTML = '<option value="">请选择</option>';
    CATEGORY_ORDER.forEach(cat => {
        if (bank[cat] && bank[cat].length) { const o = document.createElement("option"); o.value = cat; o.textContent = cat; selectEl.appendChild(o); }
    });
    const wc = getTotalWrongWordsCount();
    if (wc > 0) { const o = document.createElement("option"); o.value = WRONG_CATEGORY_VALUE; o.textContent = `⭐ 错词本 (${wc}词)`; o.style.color = "#f59e0b"; o.style.fontWeight = "bold"; selectEl.appendChild(o); }
    if (cv && selectEl.querySelector(`option[value="${cv}"]`)) selectEl.value = cv;
}
function cleanVariant(s) { return String(s||"").trim().replace(/[－—–]/g," ").replace(/\s+-\s+/g," ").replace(/\s+/g," ").replace(/^[\s.,;:]+|[\s.,;:]+$/g,"").trim(); }
function parseVariants(en) {
    if (!en) return [];
    let s = String(en).replace(/\s+或\s+/g," / ").replace(/[；;]/g,"/");
    const parts = s.split("/").map(cleanVariant).filter(Boolean);
    return [...new Set(parts.length ? parts : [cleanVariant(en)])];
}
function normalizeForCompare(s) { return String(s||"").toLowerCase().replace(/[－—–]/g,"-").replace(/\s+-\s+/g," ").replace(/[^a-z0-9\s&-]/g,"").replace(/\s+/g," ").trim(); }
function levenshtein(a,b) {
    a=String(a||"").toLowerCase(); b=String(b||"").toLowerCase();
    const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
    const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j;
    for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    return dp[m][n];
}
function getBestVariant(variants,typed) {
    if(!variants.length) return {variant:"",words:[]};
    if(typed.every(w=>!w)) { const v=variants[0]||""; return {variant:v,words:v.split(/\s+/).filter(Boolean)}; }
    let best=variants[0], bs=Infinity;
    for(const v of variants) {
        const ws=v.split(/\s+/).filter(Boolean); let sc=Math.abs(ws.length-typed.length)*3;
        for(let i=0;i<typed.length;i++) sc+=levenshtein(typed[i]||"",ws[i]||"");
        if(sc<bs) { bs=sc; best=v; }
    }
    return {variant:best,words:best.split(/\s+/).filter(Boolean)};
}
function formatTime(s) { return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function updateTimerDisplay() { timerEl.textContent=formatTime(seconds); }
function startTimer() { stopTimer(); seconds=0; updateTimerDisplay(); timerInterval=setInterval(()=>{seconds++;updateTimerDisplay();},1000); }
function stopTimer() { if(timerInterval){clearInterval(timerInterval);timerInterval=null;} }
function shuffle(a) { const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

function startPractice() {
    const cat = selectEl.value; if (!cat) return;
    isWrongWordsMode = (cat === WRONG_CATEGORY_VALUE);
    currentCategory = isWrongWordsMode ? "错词本" : cat;
    let dataToUse = [];
    if (isWrongWordsMode) {
        for (const c in wrongWordsBank) wrongWordsBank[c].forEach(item => { const arr=[item.zh,item.en]; arr.originalCategory=c; dataToUse.push(arr); });
        if (!dataToUse.length) { alert("错词本是空的！"); return; }
        categoryData = shuffle(dataToUse);
    } else {
        if (!bank[cat] || !bank[cat].length) return;
        categoryData = bank[cat]; // 正常分类按顺序
    }
    currentIndex=0; results=[]; totalScore=0; totalPossibleWords=0; running=true;
    selectEl.disabled=true; startBtn.disabled=true; endBtn.disabled=false; speakBtn.disabled=false;
    startTimer(); renderCurrent(); startBtn.blur(); selectEl.blur();
}
function renderCurrent() {
    if(!categoryData.length||currentIndex>=categoryData.length) return;
    const item=categoryData[currentIndex];
    chineseWordEl.textContent=item[0];
    progressEl.textContent=`第 ${currentIndex+1} / ${categoryData.length} 题`;
    phoneticRequestId++; phoneticText.textContent="";
    if("speechSynthesis" in window) window.speechSynthesis.cancel();
    currentItemVariants=parseVariants(item[1]);
    const fw=(currentItemVariants[0]||"").split(/\s+/).filter(Boolean);
    typedWords=Array(Math.max(1,fw.length)).fill(""); currentWordIndex=0;
    renderInput(); updateStarBtnState();
}
function renderInput() {
    inputAreaEl.innerHTML="";
    const best=getBestVariant(currentItemVariants,typedWords);
    for(let i=0;i<typedWords.length;i++) {
        const slot=document.createElement("div");
        slot.className="word-slot"+(i===currentWordIndex?" active":"");
        const tw=best.words[i]||"";
        slot.style.minWidth=Math.max(4,tw.length+2)+"ch";
        const td=typedWords[i]||"";
        if(!td) { const ph=document.createElement("span"); ph.className="placeholder"; ph.textContent="_".repeat(Math.max(3,tw.length||3)); slot.appendChild(ph); }
        else {
            for(let j=0;j<td.length;j++) { const sp=document.createElement("span"); sp.textContent=td[j]; const tc=(tw[j]||"").toLowerCase(); sp.className=(tc&&td[j].toLowerCase()===tc)?"ok":"bad"; slot.appendChild(sp); }
            if(tw.length>td.length) { const rem=document.createElement("span"); rem.className="placeholder"; rem.textContent="_".repeat(tw.length-td.length); slot.appendChild(rem); }
        }
        inputAreaEl.appendChild(slot);
    }
}
function evaluateCurrent() {
    const item=categoryData[currentIndex];
    const variants=currentItemVariants.length?currentItemVariants:parseVariants(item[1]);
    const tp=typedWords.map(w=>w.trim()).filter(Boolean).join(" ").replace(/\s+/g," ").trim();
    const nu=normalizeForCompare(tp);
    let mv=null; for(const v of variants) if(nu&&normalizeForCompare(v)===nu){mv=v;break;}
    const best=getBestVariant(variants,typedWords);
    let cw=[],pw=0,g=0,wc=[];
    if(mv) { cw=mv.split(/\s+/).filter(Boolean); pw=cw.length; g=pw*10; wc=cw.map(()=>true); }
    else { cw=best.words.length?best.words:[""]; pw=cw.length; wc=cw.map((w,i)=>normalizeForCompare(typedWords[i]||"")===normalizeForCompare(w)); g=wc.filter(Boolean).length*10; }
    // 答错自动加入错词本
    if(g<pw*10) { const ic=item.originalCategory||currentCategory; if(ic!=="错词本") addStarredWord(ic,item[0],item[1]); }
    return {zh:item[0],user:tp||"(未输入)",correct:variants.join(" / "),correctWords:cw,possibleWords:pw,gained:g,wordChecks:wc};
}
function submitCurrent() {
    if(!running||currentIndex<0||currentIndex>=categoryData.length) return;
    const ev=evaluateCurrent(); results.push(ev); totalScore+=ev.gained; totalPossibleWords+=ev.possibleWords;
    currentIndex++;
    if(currentIndex>=categoryData.length) finishPractice(); else renderCurrent();
}
function endPractice() {
    if(!running) return;
    if(currentIndex>=0&&currentIndex<categoryData.length) { const ev=evaluateCurrent(); results.push(ev); totalScore+=ev.gained; totalPossibleWords+=ev.possibleWords; }
    finishPractice();
}
function finishPractice() {
    running=false; stopTimer(); endBtn.disabled=true; speakBtn.disabled=true; starBtn.hidden=true; starBtn.disabled=true;
    phoneticRequestId++; if("speechSynthesis" in window) window.speechSynthesis.cancel();
    showSummary();
}
function showSummary() {
    const ci=results.filter(r=>r.gained===r.possibleWords*10).length;
    const cwr=Math.round(totalScore/10);
    summaryStats.innerHTML=`<div><strong>练习大类：</strong>${escapeHtml(currentCategory)}</div><div><strong>用时：</strong>${formatTime(seconds)}</div><div><strong>总分：</strong>${totalScore} / ${totalPossibleWords*10}</div><div><strong>答对单词数：</strong>${cwr} / ${totalPossibleWords}</div><div><strong>完全答对词条数：</strong>${ci} / ${results.length}</div>`;
    errorReport.innerHTML="";
    const wr=results.filter(r=>r.gained<r.possibleWords*10);
    if(!wr.length) errorReport.innerHTML="<p style='color:#16a34a;font-weight:bold;'>全部正确，太棒了！</p>";
    else wr.forEach(r=>{
        const box=document.createElement("div"); box.className="wrong-item";
        const zh=document.createElement("div"); zh.className="zh"; zh.textContent=r.zh;
        const ul=document.createElement("div"); const ull=document.createElement("span"); ull.className="line-label"; ull.textContent="你的输入："; ul.appendChild(ull);
        if(r.user==="(未输入)") { const sp=document.createElement("span"); sp.className="missed-word"; sp.textContent="(未输入)"; ul.appendChild(sp); }
        else { const uw=r.user.split(/\s+/).filter(Boolean); const ml=Math.max(uw.length,r.correctWords.length); for(let i=0;i<ml;i++){const sp=document.createElement("span");if(i<uw.length){sp.textContent=uw[i];sp.className=r.wordChecks[i]?"correct-word":"wrong-word";}else{sp.textContent="___";sp.className="missed-word";}ul.appendChild(sp);} }
        const cl=document.createElement("div"); const cll=document.createElement("span"); cll.className="line-label"; cll.textContent="正确答案："; cl.appendChild(cll);
        r.correctWords.forEach(w=>{const sp=document.createElement("span");sp.className="correct-word";sp.textContent=w;cl.appendChild(sp);});
        const al=document.createElement("div"); al.className="all-answer"; al.textContent="可接受答案："+r.correct;
        box.appendChild(zh); box.appendChild(ul); box.appendChild(cl); box.appendChild(al); errorReport.appendChild(box);
    });
    summaryOverlay.hidden=false;
}
function closeSummary() {
    summaryOverlay.hidden=true; selectEl.disabled=false; selectEl.value=""; startBtn.disabled=true; endBtn.disabled=true; speakBtn.disabled=true; starBtn.hidden=true; starBtn.disabled=true;
    running=false; isWrongWordsMode=false; currentIndex=-1; categoryData=[]; results=[]; totalScore=0; totalPossibleWords=0; seconds=0;
    updateTimerDisplay(); updateSelectOptions();
    chineseWordEl.textContent="请选择大类，然后点击“开始练习”"; inputAreaEl.innerHTML=""; progressEl.textContent=""; phoneticText.textContent="";
    phoneticRequestId++; if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function escapeHtml(s) { return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
function handleKeyDown(e) {
    if(!running) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==="Enter") { e.preventDefault(); submitCurrent(); return; }
    if(e.key==="Backspace") { e.preventDefault(); if(typedWords[currentWordIndex].length>0) typedWords[currentWordIndex]=typedWords[currentWordIndex].slice(0,-1); else if(currentWordIndex>0) currentWordIndex--; renderInput(); return; }
    if(e.key===" ") { e.preventDefault(); if(currentWordIndex<typedWords.length-1) currentWordIndex++; renderInput(); return; }
    if(e.key.length===1&&/^[a-zA-Z0-9&\-']$/.test(e.key)) {
        e.preventDefault(); typedWords[currentWordIndex]+=e.key.toLowerCase();
        const best=getBestVariant(currentItemVariants,typedWords); const tw=best.words[currentWordIndex]||"";
        if(tw&&typedWords[currentWordIndex].length>=tw.length&&currentWordIndex<typedWords.length-1) currentWordIndex++;
        renderInput();
    }
}
selectEl.addEventListener("change",()=>{
    if(selectEl.value) { startBtn.disabled=false; const txt=selectEl.value===WRONG_CATEGORY_VALUE?"⭐ 错词本":selectEl.value; chineseWordEl.textContent=`已选择：${txt}，请点击“开始练习”`; }
    else { startBtn.disabled=true; chineseWordEl.textContent="请选择大类，然后点击“开始练习”"; }
    inputAreaEl.innerHTML=""; progressEl.textContent=""; phoneticText.textContent=""; seconds=0; updateTimerDisplay();
});
startBtn.addEventListener("click",startPractice);
endBtn.addEventListener("click",endPractice);
closeSummaryBtn.addEventListener("click",closeSummary);
document.addEventListener("keydown",handleKeyDown);

loadWrongWords();
initBank();
updateSelectOptions();
