<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>专业术语英语打字练习</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      height: 100vh;
      overflow: hidden;
    }

    [hidden] {
      display: none !important;
    }

    #topbar {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.95);
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 280px;
    }

    .top-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select,
    button {
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 8px 10px;
      outline: none;
    }

    select {
      min-width: 170px;
      background: #fff;
    }

    #startBtn {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #startBtn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    #timer {
      font-size: 20px;
      font-weight: bold;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 10px;
      min-width: 90px;
      text-align: center;
    }

    #mainArea {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    #progress {
      font-size: 18px;
      color: #475569;
      margin-bottom: 16px;
      min-height: 24px;
    }

    #chineseWord {
      font-size: 56px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 16px;
      max-width: 80vw;
      line-height: 1.25;
    }

    #pronunciationArea {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
      min-height: 48px;
      flex-wrap: wrap;
      max-width: 90vw;
    }

    #speakBtn {
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 22px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #speakBtn:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
    }

    #speakBtn:disabled {
      background: #a7f3d0;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #phoneticText {
      font-size: 24px;
      color: #475569;
      font-style: italic;
      font-family: "Lucida Sans Unicode", "Arial Unicode MS", "DejaVu Sans", sans-serif;
      text-align: left;
      line-height: 1.5;
    }

    #inputArea {
      min-height: 110px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .word-slot {
      min-width: 90px;
      min-height: 62px;
      padding: 6px 10px;
      font-size: 40px;
      font-weight: 700;
      border-bottom: 5px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      color: #111827;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px 8px 0 0;
    }

    .word-slot.active {
      border-bottom-color: #2563eb;
      background: rgba(37, 99, 235, 0.08);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.08);
    }

    .placeholder {
      color: #c7cdd8;
      font-weight: normal;
    }

    .ok {
      color: #16a34a;
    }

    .bad {
      color: #dc2626;
      text-decoration: underline;
    }

    #hint {
      color: #64748b;
      font-size: 15px;
      line-height: 1.8;
    }

    #endBtn {
      position: fixed;
      right: 26px;
      bottom: 26px;
      z-index: 20;
      background: #dc2626;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.25);
    }

    #endBtn:disabled {
      background: #fca5a5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .dialog {
      width: min(920px, 94vw);
      max-height: 86vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .dialog h2 {
      margin-top: 0;
      color: #111827;
    }

    .summary-stats {
      font-size: 18px;
      line-height: 2;
      color: #1f2937;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .wrong-item {
      border: 1px solid #fecaca;
      background: #fff5f5;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: left;
    }

    .wrong-item .zh {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 8px;
    }

    .line-label {
      color: #475569;
      font-weight: bold;
      margin-right: 8px;
    }

    .correct-word {
      color: #15803d;
      font-weight: bold;
      margin-right: 10px;
    }

    .wrong-word {
      color: #dc2626;
      font-weight: bold;
      text-decoration: underline;
      margin-right: 10px;
    }

    .missed-word {
      color: #94a3b8;
      font-weight: bold;
      margin-right: 10px;
    }

    .all-answer {
      color: #334155;
      margin-top: 6px;
    }

    #closeSummaryBtn {
      margin-top: 16px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 10px 18px;
    }

    @media (max-width: 700px) {
      #chineseWord {
        font-size: 36px;
      }

      .word-slot {
        font-size: 28px;
        min-width: 64px;
        min-height: 48px;
      }

      #topbar {
        min-width: auto;
        right: 18px;
      }

      #phoneticText {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="top-row">
      <label for="categorySelect" style="font-weight:bold;">选择大类：</label>
      <select id="categorySelect">
        <option value="">请选择</option>
      </select>
      <button id="startBtn" disabled>开始练习</button>
    </div>
    <div class="top-row">
      <span style="font-weight:bold;">计时：</span>
      <div id="timer">00:00</div>
    </div>
  </div>

  <div id="mainArea">
    <div id="progress"></div>
    <div id="chineseWord">请选择大类，然后点击“开始练习”</div>

    <div id="pronunciationArea">
      <button id="speakBtn" disabled title="本地音标优先；未收录时尝试在线音标">🔊 发音</button>
      <span id="phoneticText"></span>
    </div>

    <div id="inputArea"></div>
    <div id="hint">
      输入说明：字母错误会标红；多个英文单词用空格切换；按 Enter 提交并下一题；点击“发音”可听读音并查看音标。
    </div>
  </div>

  <button id="endBtn" disabled>结束练习</button>

  <div id="summaryOverlay" class="overlay" hidden>
    <div class="dialog">
      <h2>练习总结</h2>
      <div id="summaryStats" class="summary-stats"></div>
      <h3>错误报告</h3>
      <div id="errorReport"></div>
      <button id="closeSummaryBtn">关闭并返回</button>
    </div>
  </div>

    function normalizePhoneticKey(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function getLocalPhonetic(text) {
      const key = normalizePhoneticKey(text);

      if (!key) return "";

      // 1. 优先完整词条
      if (LOCAL_PHONETICS[key]) {
        return LOCAL_PHONETICS[key];
      }

      // 2. 如果是词组，且每个单词都有本地音标，则拼接
      const words = key.split(/\s+/).filter(Boolean);

      if (words.length > 1) {
        const parts = [];

        for (const word of words) {
          const wordPhonetic = LOCAL_PHONETICS[word];

          if (!wordPhonetic) {
            return "";
          }

          parts.push(wordPhonetic);
        }

        if (parts.length === words.length) {
          return parts.join(" ");
        }
      }

      return "";
    }

    function prepareSpeechText(text) {
      const raw = String(text || "").trim();

      if (!raw) return "";

      const tokens = raw.split(/\s+/).filter(Boolean);

      const spokenTokens = tokens.map(token => {
        const lettersOnly = token.replace(/[^A-Za-z]/g, "");

        // 2~6 个纯大写字母，按字母朗读，例如 ECN -> E C N
        if (/^[A-Z]{2,6}$/.test(lettersOnly)) {
          return lettersOnly.split("").join(" ");
        }

        // 单个大写字母，例如 V
        if (/^[A-Z]$/.test(lettersOnly)) {
          return lettersOnly;
        }

        return token;
      });

      return spokenTokens.join(" ");
    }

    function speakWord(text) {
      if (!text || !("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const speechText = prepareSpeechText(text);

      const utterance = new SpeechSynthesisUtterance(speechText || text);
      utterance.lang = "en-US";
      utterance.rate = 0.9;
      utterance.pitch = 1;

      window.speechSynthesis.speak(utterance);
    }

    async function getOnlinePhoneticForWord(word) {
      try {
        const cleanWord = String(word || "").trim();

        if (!cleanWord) return "";

        const response = await fetch(
          `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanWord.toLowerCase())}`
        );

        if (!response.ok) return "";

        const data = await response.json();

        const entry = Array.isArray(data) ? data[0] : null;

        if (!entry || !Array.isArray(entry.phonetics)) return "";

        // 优先找带美式音频的音标
        const usPhonetic = entry.phonetics.find(
          item => item.text && item.audio && item.audio.includes("-us")
        );

        if (usPhonetic && usPhonetic.text) {
          return usPhonetic.text;
        }

        // 其次找标准 /.../ 格式音标
        const slashPhonetic = entry.phonetics.find(
          item => item.text && item.text.startsWith("/")
        );

        if (slashPhonetic && slashPhonetic.text) {
          return slashPhonetic.text;
        }

        // 最后兜底
        const anyPhonetic = entry.phonetics.find(item => item.text);

        if (anyPhonetic && anyPhonetic.text) {
          return anyPhonetic.text;
        }

        return "";
      } catch (error) {
        return "";
      }
    }

    async function fetchPhonetic(text) {
      const requestId = ++phoneticRequestId;

      if (!text) {
        phoneticText.textContent = "";
        return;
      }

      // 1. 本地音标优先
      const localPhonetic = getLocalPhonetic(text);

      if (localPhonetic) {
        phoneticText.textContent = localPhonetic;
        phoneticText.style.color = "#0f766e";
        return;
      }

      phoneticText.textContent = "尝试获取音标中...";
      phoneticText.style.color = "#94a3b8";

      try {
        const words = String(text).split(/\s+/).filter(Boolean);

        const promises = words.map(async word => {
          const cacheKey = normalizePhoneticKey(word);

          if (phoneticCache.has(cacheKey)) {
            return phoneticCache.get(cacheKey);
          }

          const onlinePhonetic = await getOnlinePhoneticForWord(word);
          phoneticCache.set(cacheKey, onlinePhonetic);

          return onlinePhonetic;
        });

        const phonetics = await Promise.all(promises);

        if (requestId !== phoneticRequestId) return;

        const allSuccess = phonetics.length > 0 && phonetics.every(Boolean);

        if (allSuccess) {
          phoneticText.textContent = phonetics.join(" ") + "（自动音标，仅供参考）";
          phoneticText.style.color = "#475569";
        } else {
          phoneticText.textContent = "（暂无可靠音标）";
          phoneticText.style.color = "#94a3b8";
        }
      } catch (error) {
        if (requestId === phoneticRequestId) {
          console.error("获取音标失败:", error);
          phoneticText.textContent = "（音标获取失败）";
          phoneticText.style.color = "#ef4444";
        }
      }
    }

        const m = line.match(/^(.*?)[：:](.*)$/);

          const zh = m[1].trim();

          if (zh && en) {
            bank[current].push([zh, en]);
          }
        }
      }

      if (!bank["通用之件类"]) bank["通用之件类"] = [];

      const commonParts = [

    function cleanVariant(s) {
      return String(s || "")
        .trim()
        .replace(/[－—–]/g, " ")
        .replace(/\s+-\s+/g, " ")
        .replace(/\s+/g, " ")
        .replace(/^[\s.,;:]+|[\s.,;:]+$/g, "")
        .trim();
    }

    function parseVariants(en) {
      if (!en) return [];
      let s = String(en)
        .replace(/\s+或\s+/g, " / ")
        .replace(/[；;]/g, "/");

      const parts = s
        .split("/")
        .map(cleanVariant)
        .filter(Boolean);

      return [...new Set(parts.length ? parts : [cleanVariant(en)])];
    }

    function normalizeForCompare(s) {
      return String(s || "")
        .toLowerCase()
        .replace(/[－—–]/g, "-")
        .replace(/\s+-\s+/g, " ")
        .replace(/[^a-z0-9\s&-]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function levenshtein(a, b) {
      a = String(a || "").toLowerCase();
      b = String(b || "").toLowerCase();

      const m = a.length;
      const n = b.length;

      if (!m) return n;
      if (!n) return m;

      const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

      for (let i = 0; i <= m; i++) dp[i][0] = i;
      for (let j = 0; j <= n; j++) dp[0][j] = j;

      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }

      return dp[m][n];
    }

    function getBestVariant(variants, typed) {
      if (!variants.length) return { variant: "", words: [] };

      if (typed.every(w => !w)) {
        const v = variants[0] || "";
        return { variant: v, words: v.split(/\s+/).filter(Boolean) };
      }

      let best = variants[0];
      let bestScore = Infinity;

      for (const v of variants) {
        const words = v.split(/\s+/).filter(Boolean);
        let score = Math.abs(words.length - typed.length) * 3;

        for (let i = 0; i < typed.length; i++) {
          score += levenshtein(typed[i] || "", words[i] || "");
        }

        if (score < bestScore) {
          bestScore = score;
          best = v;
        }
      }

      return { variant: best, words: best.split(/\s+/).filter(Boolean) };
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      timerEl.textContent = formatTime(seconds);
    }

    function startTimer() {
      stopTimer();
      seconds = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        seconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startPractice() {
      const cat = selectEl.value;
      if (!cat || !bank[cat] || !bank[cat].length) return;

      currentCategory = cat;
      categoryData = shuffle(bank[cat]);
      currentIndex = 0;

      results = [];
      totalScore = 0;
      totalPossibleWords = 0;

      running = true;
      selectEl.disabled = true;
      startBtn.disabled = true;
      endBtn.disabled = false;

      startTimer();

    function renderCurrent() {
      if (!categoryData.length || currentIndex >= categoryData.length) return;

      const item = categoryData[currentIndex];
      chineseWordEl.textContent = item[0];
      progressEl.textContent = `第 ${currentIndex + 1} / ${categoryData.length} 题`;

      // 切题时取消旧请求和旧发音
      phoneticRequestId++;
      phoneticText.textContent = "";
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      currentItemVariants = parseVariants(item[1]);
      const firstWords = (currentItemVariants[0] || "").split(/\s+/).filter(Boolean);
      const slotCount = Math.max(1, firstWords.length);

      typedWords = Array(slotCount).fill("");
      currentWordIndex = 0;

      renderInput();
    }

    function renderInput() {
      inputAreaEl.innerHTML = "";

      const best = getBestVariant(currentItemVariants, typedWords);

      for (let i = 0; i < typedWords.length; i++) {
        const slot = document.createElement("div");
        slot.className = "word-slot" + (i === currentWordIndex ? " active" : "");

        const targetWord = best.words[i] || "";
        slot.style.minWidth = Math.max(4, targetWord.length + 2) + "ch";

        const typed = typedWords[i] || "";

        if (!typed) {
          const ph = document.createElement("span");
          ph.className = "placeholder";
          ph.textContent = "_".repeat(Math.max(3, targetWord.length || 3));
          slot.appendChild(ph);
        } else {
          for (let j = 0; j < typed.length; j++) {
            const span = document.createElement("span");
            span.textContent = typed[j];

            const targetChar = (targetWord[j] || "").toLowerCase();
            if (targetChar && typed[j].toLowerCase() === targetChar) {
              span.className = "ok";
            } else {
              span.className = "bad";
            }

            slot.appendChild(span);
          }

          if (targetWord.length > typed.length) {
            const rem = document.createElement("span");
            rem.className = "placeholder";
            rem.textContent = "_".repeat(targetWord.length - typed.length);
            slot.appendChild(rem);
          }
        }

        inputAreaEl.appendChild(slot);
      }
    }

    function evaluateCurrent() {
      const item = categoryData[currentIndex];
      const variants = currentItemVariants.length ? currentItemVariants : parseVariants(item[1]);

      const typedPhrase = typedWords
        .map(w => w.trim())
        .filter(Boolean)
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();

      const normalizedUser = normalizeForCompare(typedPhrase);

      let matchedVariant = null;
      for (const v of variants) {
        if (normalizedUser && normalizeForCompare(v) === normalizedUser) {
          matchedVariant = v;
          break;
        }
      }

      const best = getBestVariant(variants, typedWords);

      let correctWords = [];
      let possibleWords = 0;
      let gained = 0;
      let wordChecks = [];

      if (matchedVariant) {
        correctWords = matchedVariant.split(/\s+/).filter(Boolean);
        possibleWords = correctWords.length;
        gained = possibleWords * 10;
        wordChecks = correctWords.map(() => true);
      } else {
        correctWords = best.words.length ? best.words : [""];
        possibleWords = correctWords.length;
        wordChecks = correctWords.map(
          (w, i) => normalizeForCompare(typedWords[i] || "") === normalizeForCompare(w)
        );
        gained = wordChecks.filter(Boolean).length * 10;
      }

      return {
        zh: item[0],
        user: typedPhrase || "(未输入)",
        correct: variants.join(" / "),
        correctWords,
        possibleWords,
        gained,
        wordChecks
      };
    }

    function submitCurrent() {
      if (!running || currentIndex < 0 || currentIndex >= categoryData.length) return;

      const evaluation = evaluateCurrent();
      results.push(evaluation);
      totalScore += evaluation.gained;
      totalPossibleWords += evaluation.possibleWords;

      currentIndex++;

      if (currentIndex >= categoryData.length) {
        finishPractice();
      } else {
        renderCurrent();
      }
    }

    function endPractice() {
      if (!running) return;

      if (currentIndex >= 0 && currentIndex < categoryData.length) {
        const evaluation = evaluateCurrent();
        results.push(evaluation);
        totalScore += evaluation.gained;
        totalPossibleWords += evaluation.possibleWords;
      }

      finishPractice();
    }

    function finishPractice() {
      running = false;
      stopTimer();
      endBtn.disabled = true;
      speakBtn.disabled = true;

      phoneticRequestId++;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      showSummary();
    }

    function showSummary() {
      const correctItems = results.filter(r => r.gained === r.possibleWords * 10).length;
      const correctWords = Math.round(totalScore / 10);

      summaryStats.innerHTML = `
        <div><strong>练习大类：</strong>${escapeHtml(currentCategory)}</div>
        <div><strong>用时：</strong>${formatTime(seconds)}</div>
        <div><strong>总分：</strong>${totalScore} / ${totalPossibleWords * 10}</div>
        <div><strong>答对单词数：</strong>${correctWords} / ${totalPossibleWords}</div>
        <div><strong>完全答对词条数：</strong>${correctItems} / ${results.length}</div>
      `;

      errorReport.innerHTML = "";

      const wrongResults = results.filter(r => r.gained < r.possibleWords * 10);

      if (!wrongResults.length) {
        errorReport.innerHTML = "<p style='color:#16a34a;font-weight:bold;'>全部正确，太棒了！</p>";
      } else {
        wrongResults.forEach(r => {
          const box = document.createElement("div");
          box.className = "wrong-item";

          const zh = document.createElement("div");
          zh.className = "zh";
          zh.textContent = r.zh;

          const userLine = document.createElement("div");
          const userLabel = document.createElement("span");
          userLabel.className = "line-label";
          userLabel.textContent = "你的输入：";
          userLine.appendChild(userLabel);

          if (r.user === "(未输入)") {
            const span = document.createElement("span");
            span.className = "missed-word";
            span.textContent = "(未输入)";
            userLine.appendChild(span);
          } else {
            const userWords = r.user.split(/\s+/).filter(Boolean);
            const maxLen = Math.max(userWords.length, r.correctWords.length);

            for (let i = 0; i < maxLen; i++) {
              const span = document.createElement("span");

              if (i < userWords.length) {
                span.textContent = userWords[i];
                span.className = r.wordChecks[i] ? "correct-word" : "wrong-word";
              } else {
                span.textContent = "___";
                span.className = "missed-word";
              }

              userLine.appendChild(span);
            }
          }

          const correctLine = document.createElement("div");
          const correctLabel = document.createElement("span");
          correctLabel.className = "line-label";
          correctLabel.textContent = "正确答案：";
          correctLine.appendChild(correctLabel);

          r.correctWords.forEach(w => {
            const span = document.createElement("span");
            span.className = "correct-word";
            span.textContent = w;
            correctLine.appendChild(span);
          });

          const allLine = document.createElement("div");
          allLine.className = "all-answer";
          allLine.textContent = "可接受答案：" + r.correct;

          box.appendChild(zh);
          box.appendChild(userLine);
          box.appendChild(correctLine);
          box.appendChild(allLine);

          errorReport.appendChild(box);
        });
      }

      summaryOverlay.hidden = false;
    }

    function closeSummary() {
      summaryOverlay.hidden = true;

      selectEl.disabled = false;
      selectEl.value = "";
      startBtn.disabled = true;
      endBtn.disabled = true;
      speakBtn.disabled = true;

      running = false;
      currentIndex = -1;
      categoryData = [];
      results = [];
      totalScore = 0;
      totalPossibleWords = 0;

      seconds = 0;
      updateTimerDisplay();

      chineseWordEl.textContent = "请选择大类，然后点击“开始练习”";
      inputAreaEl.innerHTML = "";
      progressEl.textContent = "";
      phoneticText.textContent = "";

      phoneticRequestId++;
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function escapeHtml(s) {
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function handleKeyDown(e) {
      if (!running) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === "Enter") {
        e.preventDefault();
        submitCurrent();
        return;
      }

      if (e.key === "Backspace") {
        e.preventDefault();

        if (typedWords[currentWordIndex].length > 0) {
          typedWords[currentWordIndex] = typedWords[currentWordIndex].slice(0, -1);
        } else if (currentWordIndex > 0) {
          currentWordIndex--;
        }

        renderInput();
        return;
      }

      if (e.key === " ") {
        e.preventDefault();

        if (currentWordIndex < typedWords.length - 1) {
          currentWordIndex++;
        }

        renderInput();
        return;
      }

      if (e.key.length === 1 && /^[a-zA-Z0-9&\-']$/.test(e.key)) {
        e.preventDefault();

        typedWords[currentWordIndex] += e.key.toLowerCase();

        const best = getBestVariant(currentItemVariants, typedWords);
        const targetWord = best.words[currentWordIndex] || "";

        if (
          targetWord &&
          typedWords[currentWordIndex].length >= targetWord.length &&
          currentWordIndex < typedWords.length - 1
        ) {
          currentWordIndex++;
        }

        renderInput();
      }
    }

    selectEl.addEventListener("change", () => {
      if (selectEl.value) {
        startBtn.disabled = false;
        chineseWordEl.textContent = `已选择：${selectEl.value}，请点击“开始练习”`;
        inputAreaEl.innerHTML = "";
        progressEl.textContent = "";
        phoneticText.textContent = "";
        seconds = 0;
        updateTimerDisplay();
      } else {
        startBtn.disabled = true;
        chineseWordEl.textContent = "请选择大类，然后点击“开始练习”";
        inputAreaEl.innerHTML = "";
        progressEl.textContent = "";
        phoneticText.textContent = "";
      }
    });

    startBtn.addEventListener("click", startPractice);
    endBtn.addEventListener("click", endPractice);
    closeSummaryBtn.addEventListener("click", closeSummary);
    document.addEventListener("keydown", handleKeyDown);

    initBank();
    populateSelect();
  </script>
</body>
</html>
